<svg width="900" height="1025" viewBox="0 0 900 1025" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI-Assisted Security Operations Sandbox — Architecture</title>
<desc>Tři AWS účty: Workload, Security, Management. Workload obsahuje dvě honeypot VPC: aktivní, Terraform-spravovanou, a historickou CloudFormation srovnávací verzi (ADR-006, odstraněna). GuardDuty a Security Hub agregují nálezy v Security účtu. EventBridge rule filtruje jen GuardDuty-origin findings a má dva paralelní targets: CloudWatch Logs a Lambda, která volá Bedrock (Claude Haiku) a zapisuje výstup do CloudWatch Logs a DynamoDB + SNS.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#86198f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#b91c1c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="1025" fill="#ffffff"/>

<!-- Workload account -->
<rect x="40" y="30" width="820" height="225" rx="16" fill="#fff1ee" stroke="#f4a58a" stroke-width="1"/>
<text x="60" y="58" font-size="15" font-weight="700" fill="#9a3412">Workload account</text>
<text x="60" y="76" font-size="12" fill="#9a3412">Honeypot — reálná data pro Fázi B</text>

<!-- Internet / bots indicator — spans both rows -->
<rect x="80" y="95" width="180" height="130" rx="10" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
<text x="170" y="150" font-size="12" font-weight="600" text-anchor="middle" fill="#991b1b">Internet</text>
<text x="170" y="165" font-size="10" text-anchor="middle" fill="#991b1b">Boti, skenery</text>
<text x="170" y="178" font-size="10" text-anchor="middle" fill="#991b1b">(Shodan/Censys)</text>

<!-- Row 1: Terraform-managed honeypot (active) -->
<line x1="260" y1="122" x2="418" y2="122" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="270" y="115" font-size="9" fill="#b91c1c">port scan / brute-force</text>

<rect x="420" y="90" width="320" height="65" rx="10" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="435" y="104" font-size="9" fill="#64748b">VPC 10.42.0.0/24 (Terraform) — veřejný subnet + IGW</text>

<rect x="435" y="112" width="290" height="38" rx="10" fill="#ffe4e6" stroke="#fb7185" stroke-width="1.5"/>
<text x="580" y="127" font-size="11" font-weight="700" text-anchor="middle" fill="#9f1239">Honeypot EC2 (vl-honeypot)</text>
<text x="580" y="141" font-size="9" text-anchor="middle" fill="#9f1239">t3.micro, port 22, bez SSH klíče/IAM role — AKTUÁLNÍ</text>

<!-- Row 2: CloudFormation comparison experiment (removed) -->
<line x1="260" y1="197" x2="418" y2="197" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-gray)"/>
<text x="270" y="190" font-size="9" fill="#64748b">(historicky, po dobu experimentu)</text>

<rect x="420" y="165" width="320" height="65" rx="10" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="435" y="179" font-size="9" fill="#94a3b8">VPC 10.42.0.0/24 (CloudFormation, ADR-006)</text>

<rect x="435" y="187" width="290" height="38" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="580" y="202" font-size="11" font-weight="700" text-anchor="middle" fill="#64748b">Honeypot EC2 (CloudFormation)</text>
<text x="580" y="216" font-size="9" text-anchor="middle" fill="#64748b">Terraform vs. CFN srovnání — ODSTRANĚNO</text>

<line x1="450" y1="255" x2="450" y2="273" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Security account container -->
<rect x="40" y="275" width="820" height="580" rx="16" fill="#eefcfa" stroke="#5eead4" stroke-width="1"/>
<text x="60" y="303" font-size="15" font-weight="700" fill="#0f766e">Security account (delegovaný administrátor)</text>
<text x="60" y="321" font-size="12" fill="#0f766e">Detekce a AI triage</text>

<!-- GuardDuty + Security Hub -->
<rect x="300" y="335" width="300" height="50" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
<text x="450" y="356" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">GuardDuty + Security Hub</text>
<text x="450" y="373" font-size="11" text-anchor="middle" fill="#1e3a8a">Agregované nálezy</text>

<line x1="450" y1="385" x2="450" y2="403" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- EventBridge -->
<rect x="300" y="405" width="300" height="50" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
<text x="450" y="423" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">EventBridge rule</text>
<text x="450" y="438" font-size="9" text-anchor="middle" fill="#1e3a8a">Filtr: jen GuardDuty-origin findings, 2 targets</text>

<!-- Split into two branches -->
<line x1="450" y1="455" x2="450" y2="470" stroke="#475569" stroke-width="1.5"/>
<line x1="220" y1="470" x2="680" y2="470" stroke="#475569" stroke-width="1.5"/>
<line x1="220" y1="470" x2="220" y2="483" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680" y1="470" x2="680" y2="483" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Left branch: CloudWatch Logs direct -->
<rect x="80" y="485" width="280" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="220" y="506" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CloudWatch Logs (Target 1)</text>
<text x="220" y="523" font-size="11" text-anchor="middle" fill="#334155">Raw event — debug/audit trail</text>

<!-- Right branch: Lambda container, encompassing the Bedrock call -->
<rect x="540" y="485" width="280" height="205" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="560" y="506" font-size="13" font-weight="700" fill="#5b21b6">Lambda (Target 2)</text>
<text x="560" y="522" font-size="10" fill="#5b21b6">Parsuje finding, volá Bedrock, zapisuje výstup</text>

<!-- invoke / response into Bedrock -->
<line x1="680" y1="529" x2="680" y2="540" stroke="#86198f" stroke-width="1.5" marker-start="url(#arrow-small)" marker-end="url(#arrow-small)"/>
<text x="695" y="538" font-size="8" fill="#86198f">invoke / response</text>

<!-- Bedrock -->
<rect x="560" y="540" width="240" height="50" rx="10" fill="#fae8ff" stroke="#e879f9" stroke-width="1"/>
<text x="680" y="561" font-size="12" font-weight="600" text-anchor="middle" fill="#86198f">Bedrock — Claude Haiku 4.5</text>
<text x="680" y="577" font-size="10" text-anchor="middle" fill="#86198f">Shrnutí, závažnost, remediace</text>

<!-- response flows back into Lambda's own logic before exiting -->
<line x1="680" y1="590" x2="680" y2="667" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="695" y="635" font-size="9" fill="#5b21b6">Lambda přijme AI summary</text>
<text x="695" y="647" font-size="9" fill="#5b21b6">a připraví výstup</text>

<!-- Lambda writes output — exits the Lambda container -->
<line x1="680" y1="690" x2="680" y2="703" stroke="#475569" stroke-width="1.5"/>
<line x1="605" y1="703" x2="755" y2="703" stroke="#475569" stroke-width="1"/>
<line x1="605" y1="703" x2="605" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755" y1="703" x2="755" y2="716" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CloudWatch Logs output -->
<rect x="540" y="718" width="130" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="605" y="740" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">CloudWatch Logs</text>
<text x="605" y="754" font-size="10" text-anchor="middle" fill="#334155">Lambda: print(summary)</text>
<text x="605" y="766" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="700">STAV: AKTUÁLNÍ</text>

<!-- DynamoDB + SNS output -->
<rect x="690" y="718" width="130" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="755" y="740" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">DynamoDB + SNS</text>
<text x="755" y="754" font-size="10" text-anchor="middle" fill="#334155">Lambda: zápis + email</text>
<text x="755" y="766" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="700">STAV: AKTUÁLNÍ</text>

<!-- Legend -->
<line x1="80" y1="793" x2="105" y2="793" stroke="#475569" stroke-width="1.5"/>
<text x="112" y="797" font-size="10" fill="#334155">plně implementováno</text>
<line x1="270" y1="793" x2="295" y2="793" stroke="#86198f" stroke-width="1.5" marker-end="url(#arrow-small)"/>
<text x="302" y="797" font-size="10" fill="#334155">volání externí služby (Lambda → Bedrock)</text>

<line x1="80" y1="811" x2="105" y2="811" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#arrow-red)"/>
<text x="112" y="815" font-size="10" fill="#334155">reálný útočný provoz (aktivní honeypot)</text>
<rect x="270" y="805" width="20" height="12" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="297" y="815" font-size="10" fill="#334155">hranice VPC / síťová izolace</text>

<rect x="80" y="822" width="20" height="12" rx="3" fill="none" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3 3"/>
<text x="107" y="832" font-size="10" fill="#334155">historický experiment, odstraněno (ADR-006)</text>

<!-- Management account -->
<rect x="40" y="885" width="820" height="110" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="913" font-size="15" font-weight="700" fill="#334155">Management account</text>
<text x="60" y="933" font-size="12" fill="#334155">Organizations, SCPs, IAM Identity Center</text>
<text x="60" y="950" font-size="12" fill="#334155">AWS Budgets — alert při $10/účet, CloudTrail organizational trail</text>

</svg>
