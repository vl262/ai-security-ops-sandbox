<svg width="900" height="880" viewBox="0 0 900 880" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>AI-Assisted Security Operations Sandbox — Architecture</title>
<desc>Tři AWS účty: Workload, Security, Management. GuardDuty a Security Hub agregují nálezy v Security účtu. EventBridge rule má dva paralelní targets: přímý zápis do CloudWatch Logs (raw event) a Lambda. Lambda volá Bedrock (Claude Haiku) jako externí službu (invoke/response) a sama zapisuje výsledek — zatím do CloudWatch Logs (print), plánovaně i do DynamoDB + SNS. Výstup tedy pochází z Lambdy, ne přímo z Bedrocku.</desc>

<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#475569" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#86198f" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="900" height="880" fill="#ffffff"/>

<!-- Workload account -->
<rect x="40" y="30" width="820" height="70" rx="16" fill="#fff1ee" stroke="#f4a58a" stroke-width="1"/>
<text x="60" y="58" font-size="15" font-weight="700" fill="#9a3412">Workload account</text>
<text x="60" y="78" font-size="12" fill="#9a3412">Sandbox zdroje — findings vznikají zde</text>

<line x1="450" y1="100" x2="450" y2="128" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Security account container -->
<rect x="40" y="130" width="820" height="580" rx="16" fill="#eefcfa" stroke="#5eead4" stroke-width="1"/>
<text x="60" y="158" font-size="15" font-weight="700" fill="#0f766e">Security account (delegovaný administrátor)</text>
<text x="60" y="176" font-size="12" fill="#0f766e">Detekce a AI triage</text>

<!-- GuardDuty + Security Hub -->
<rect x="300" y="190" width="300" height="50" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
<text x="450" y="211" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">GuardDuty + Security Hub</text>
<text x="450" y="228" font-size="11" text-anchor="middle" fill="#1e3a8a">Agregované nálezy</text>

<line x1="450" y1="240" x2="450" y2="258" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- EventBridge -->
<rect x="300" y="260" width="300" height="50" rx="10" fill="#dbeafe" stroke="#60a5fa" stroke-width="1"/>
<text x="450" y="281" font-size="13" font-weight="600" text-anchor="middle" fill="#1e3a8a">EventBridge rule</text>
<text x="450" y="298" font-size="11" text-anchor="middle" fill="#1e3a8a">1 rule, 2 nezávislé targets</text>

<!-- Split into two branches -->
<line x1="450" y1="310" x2="450" y2="325" stroke="#475569" stroke-width="1.5"/>
<line x1="220" y1="325" x2="680" y2="325" stroke="#475569" stroke-width="1.5"/>
<line x1="220" y1="325" x2="220" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="680" y1="325" x2="680" y2="338" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- Left branch: CloudWatch Logs direct -->
<rect x="80" y="340" width="280" height="50" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="220" y="361" font-size="13" font-weight="600" text-anchor="middle" fill="#334155">CloudWatch Logs (Target 1)</text>
<text x="220" y="378" font-size="11" text-anchor="middle" fill="#334155">Raw event — debug/audit trail</text>

<!-- Right branch: Lambda container, encompassing the Bedrock call -->
<rect x="540" y="340" width="280" height="205" rx="12" fill="#ede9fe" stroke="#a78bfa" stroke-width="1.5"/>
<text x="560" y="361" font-size="13" font-weight="700" fill="#5b21b6">Lambda (Target 2)</text>
<text x="560" y="377" font-size="10" fill="#5b21b6">Parsuje finding, volá Bedrock, zapisuje výstup</text>

<!-- invoke / response into Bedrock (nested call, not a separate pipeline step) -->
<line x1="680" y1="384" x2="680" y2="395" stroke="#86198f" stroke-width="1.5" marker-start="url(#arrow-small)" marker-end="url(#arrow-small)"/>
<text x="695" y="393" font-size="8" fill="#86198f">invoke / response</text>

<!-- Bedrock — nested inside Lambda's box to show it's a call Lambda makes -->
<rect x="560" y="395" width="240" height="50" rx="10" fill="#fae8ff" stroke="#e879f9" stroke-width="1"/>
<text x="680" y="416" font-size="12" font-weight="600" text-anchor="middle" fill="#86198f">Bedrock — Claude Haiku 4.5</text>
<text x="680" y="432" font-size="10" text-anchor="middle" fill="#86198f">Shrnutí, závažnost, remediace</text>

<!-- response flows back into Lambda's own logic before exiting -->
<line x1="680" y1="445" x2="680" y2="522" stroke="#5b21b6" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="695" y="490" font-size="9" fill="#5b21b6">Lambda přijme AI summary</text>
<text x="695" y="502" font-size="9" fill="#5b21b6">a připraví výstup</text>

<!-- Lambda writes output — exits the Lambda container -->
<line x1="680" y1="545" x2="680" y2="558" stroke="#475569" stroke-width="1.5"/>
<line x1="605" y1="558" x2="755" y2="558" stroke="#475569" stroke-width="1"/>
<line x1="605" y1="558" x2="605" y2="571" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="755" y1="558" x2="755" y2="571" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<!-- CloudWatch Logs output -->
<rect x="540" y="573" width="130" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="605" y="595" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">CloudWatch Logs</text>
<text x="605" y="609" font-size="10" text-anchor="middle" fill="#334155">Lambda: print(summary)</text>
<text x="605" y="621" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="700">STAV: AKTUÁLNÍ</text>

<!-- DynamoDB + SNS output -->
<rect x="690" y="573" width="130" height="55" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
<text x="755" y="595" font-size="11" font-weight="700" text-anchor="middle" fill="#334155">DynamoDB + SNS</text>
<text x="755" y="609" font-size="10" text-anchor="middle" fill="#334155">Lambda: zápis + email</text>
<text x="755" y="621" font-size="9" text-anchor="middle" fill="#0f766e" font-weight="700">STAV: AKTUÁLNÍ</text>

<!-- Legend -->
<line x1="80" y1="648" x2="105" y2="648" stroke="#475569" stroke-width="1.5"/>
<text x="112" y="652" font-size="10" fill="#334155">plně implementováno</text>
<line x1="270" y1="648" x2="295" y2="648" stroke="#86198f" stroke-width="1.5" marker-end="url(#arrow-small)"/>
<text x="302" y="652" font-size="10" fill="#334155">volání externí služby (Lambda → Bedrock)</text>

<!-- Management account -->
<rect x="40" y="740" width="820" height="110" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
<text x="60" y="768" font-size="15" font-weight="700" fill="#334155">Management account</text>
<text x="60" y="788" font-size="12" fill="#334155">Organizations, SCPs, IAM Identity Center</text>
<text x="60" y="805" font-size="12" fill="#334155">AWS Budgets — alert při $10/účet</text>

</svg>
